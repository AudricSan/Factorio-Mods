[item-description]
er-electric-locomotive=Runs from an electric network through catenary poles or a rail transformer. Add one train battery to its equipment grid to travel beyond powered track.
er-train-battery-1=Stores electricity for short unpowered sections. Recharges under catenary, on transformer-powered rails, or at a powered station.
er-train-battery-2=Stores more electricity for longer unpowered sections.
er-train-battery-3=Stores the most electricity for long unpowered sections.
er-catenary-pole=Place it along ground-level track and connect it to an electric network with wires, up to 30 tiles apart. Powers electric locomotives passing next to it. Ordinary electric poles do not power trains.
er-rail-transformer-1=Place it next to a track and connect it to an electric network. Powers every rail connected to that track, up to 2 MW shared between all trains on it.
er-rail-transformer-2=Powers every connected rail, up to 40 MW shared between all trains on it. Replaces transformer I in place.
er-rail-transformer-3=Powers every connected rail, up to 100 MW shared between all trains on it. Replaces transformer II in place.

