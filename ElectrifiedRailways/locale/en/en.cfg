[technology-description]
er-electric-traction=Unlocks the electric locomotive and the catenary pole.
er-battery-1=Unlocks a rechargeable battery module for the electric locomotive.
er-battery-2=Unlocks a higher-capacity locomotive battery.
er-battery-3=Unlocks the highest-capacity locomotive battery.
er-rail-transformer-1=Unlocks the rail transformer, which powers every rail connected to it (2 MW).
er-rail-transformer-2=Unlocks the 40 MW rail transformer.
er-rail-transformer-3=Unlocks the 100 MW rail transformer.

[er-message]
catenary-no-track=No track next to this pole. Place it 1 to 4 tiles from the side of a track.
catenary-slot-taken=This spot is already taken by another catenary pole.
transformer-no-track=No straight track next to this transformer. Place it beside a straight rail, like a train stop.
transformer-blocked=There is no room next to the track for this transformer.
debug-help=Toggles the rail power display: green rails are powered by a transformer, cyan by several, orange by a catenary gate, red are not powered. Yellow circles show the transformer range, orange circles the catenary gate range.
debug-on=Rail power display enabled. Green: powered by a transformer. Cyan: powered by several. Orange: powered by a catenary gate. Red: not powered. Run /er-debug again to turn it off.
debug-off=Rail power display disabled.
debug-transformer=Transformer __1__ MW: __2__ powered rails, buffer __3__%
debug-summary=Rails in view: __1__ powered, __2__ not powered
