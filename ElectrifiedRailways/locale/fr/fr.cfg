[item-description]
er-electric-locomotive=Fonctionne grâce au réseau électrique via des poteaux de caténaire ou un transformateur de rail. Installe une batterie dans sa grille d’équipement pour circuler hors des voies alimentées.
er-train-battery-1=Stocke de l’électricité pour franchir de courts tronçons non alimentés. Se recharge sous caténaire, sur des rails alimentés par un transformateur ou dans une gare alimentée.
er-train-battery-2=Stocke davantage d’électricité pour franchir de plus longs tronçons non alimentés.
er-train-battery-3=Stocke le maximum d’électricité pour les longs tronçons non alimentés.
er-catenary-pole=À poser le long d’une voie au sol et à relier au réseau électrique par des câbles, jusqu’à 30 cases d’écart. Alimente les locomotives électriques qui passent à côté. Les poteaux électriques ordinaires n’alimentent pas les trains.
er-rail-transformer-1=À poser à côté d’une voie et à relier au réseau électrique. Alimente tous les rails connectés à cette voie, jusqu’à 5 MW partagés entre tous les trains.
er-rail-transformer-2=Alimente tous les rails connectés, jusqu’à 20 MW partagés entre tous les trains. Remplace le transformateur I sur place.
er-rail-transformer-3=Alimente tous les rails connectés, jusqu’à 60 MW partagés entre tous les trains. Remplace le transformateur II sur place.

