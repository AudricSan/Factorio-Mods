[technology-description]
er-electric-traction=Débloque la locomotive électrique et le poteau de caténaire.
er-battery-1=Débloque un module de batterie rechargeable pour la locomotive électrique.
er-battery-2=Débloque une batterie de locomotive de plus grande capacité.
er-battery-3=Débloque la batterie de locomotive de capacité maximale.
er-rail-transformer-1=Débloque le transformateur de rail, qui alimente tous les rails qui lui sont connectés (5 MW).
er-rail-transformer-2=Débloque le transformateur de rail de 20 MW.
er-rail-transformer-3=Débloque le transformateur de rail de 60 MW.

[er-message]
catenary-no-track=Aucun rail droit à côté de ce poteau. Pose-le à 1 à 4 cases du côté d’une voie droite.
transformer-no-track=Aucune voie droite à côté de ce transformateur. Pose-le à côté d’un rail droit, comme une gare.
transformer-blocked=Il n’y a pas de place à côté de la voie pour ce transformateur.
debug-help=Active ou désactive l’affichage de l’alimentation des rails : vert = alimenté par un transformateur, cyan = par plusieurs, orange = par une porte de caténaire, rouge = non alimenté. Les cercles jaunes montrent la portée des transformateurs, les cercles orange celle des portes de caténaire.
debug-on=Affichage de l’alimentation des rails activé. Vert : alimenté par un transformateur. Cyan : alimenté par plusieurs. Orange : alimenté par une porte de caténaire. Rouge : non alimenté. Relance /er-debug pour le désactiver.
debug-off=Affichage de l’alimentation des rails désactivé.
debug-transformer=Transformateur __1__ MW : __2__ rails alimentés, tampon __3__ %
debug-summary=Rails visibles : __1__ alimentés, __2__ non alimentés
